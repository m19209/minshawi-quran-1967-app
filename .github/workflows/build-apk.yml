name: Build Minshawi Quran APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK for Distribution
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/MinshawiQuran1967.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MinshawiQuran1967-APK
          path: build-output/MinshawiQuran1967.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.2.5
          name: "مصحف المنشاوي 1967 والأذان الذكي v1.2.5"
          body: |
            ## التحديث v1.2.5 - قياس سرعة التحميل اللحظية ونسبة الإنجاز وحفظ التباعد
            - **عداد سرعة التحميل اللحظي (Live Download Rate Measurement)**: عرض دقيق لسرعة التحميل اللحظية (مثل `2.4 MB/s` أو `850 KB/s`) أسفل مؤشر التحميل مباشرة مع تحديث مستمر كل 250 مللي ثانية.
            - **مؤشر دائري ذكي لنسبة التحميل (Circular Progress Ring)**: دائرة تفاعلية ذهبية تعرض النسبة المئوية في المنتصف بوضوح، مع شريط تقدم متوهج أسفل بطاقة السورة.
            - **علامة الحفظ بدون إنترنت (Offline Completed Indicator)**: تحول زر التحميل تلقائياً إلى أيقونة صح ذهبية (`ic_check`) بمجرد اكتمال تنزيل السورة للإشارة إلى أنها محفوظة محلياً وتعمل بدون إنترنت.
            - **الحفاظ التام على المسافة الفاصلة (Preserved 14dp Spacing)**: الإبقاء على مسافة فاصلة صارمة قدرها 14dp بين عمود التحميل وزر التشغيل لمنع أي تداخل أو تلاصق أثناء التنزيل أو قبله أو بعده.
            - **حجم الملف المنزّل**: يظهر أسفل اسم السورة حجم البيانات المنزلة مقابل الحجم الإجمالي (مثل `14.2 MB / 21.0 MB`).
          files: build-output/MinshawiQuran1967.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}