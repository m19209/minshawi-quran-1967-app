name: Build Minshawi Quran APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK for Distribution
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/MinshawiQuran1967.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MinshawiQuran1967-APK
          path: build-output/MinshawiQuran1967.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.2.1
          name: "مصحف المنشاوي 1967 والأذان الذكي v1.2.1"
          body: |
            ## التحديث v1.2.1 - تحسينات الواجهة وتنسيق قائمة الإعدادات والمشغل
            - **حل مشكلة تداخل الأزرار**: معالجة مشكلة تداخل خط الإطار الذهبي مع زر الاختيار الدائري في قائمة الأذان نهائياً وفصل العناصر بمسافات مريحة.
            - **حذف زر التنزيل**: حذف زر «تنزيل السورة» الذي كان محاطاً بالدائرة الحمراء من أسفل مشغل السور ومن قائمة السور لراحة وبساطة الاستخدام.
            - **إعادة تصميم شاملة لقائمة الإعدادات**: تنظيم واجهة الإعدادات بتبويبات تصنيف الدول (مصر، السعودية، الإمارات، بلدان أخرى) للوصول الفوري للمدينة بدون أي اقتصاص للنصوص.
            - **إبراز المدينة الحالية**: بطاقة مميزة واضحة للموقع المختار وطريقة الحساب الفلكي المعتمدة.
            - **تحسين ترتيب أزرار المشغل**: ضبط الترتيب القياسي لوسائط التشغيل والترجيع والتقديم بدون أي تداخل في الاتجاهات.
          files: build-output/MinshawiQuran1967.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}