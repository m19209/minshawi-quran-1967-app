name: Build Minshawi Quran APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK for Distribution
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/MinshawiQuran1967.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MinshawiQuran1967-APK
          path: build-output/MinshawiQuran1967.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.2.2
          name: "مصحف المنشاوي 1967 والأذان الذكي v1.2.2"
          body: |
            ## التحديث v1.2.2 - دعم كامل للعالم العربي وتحسينات المشغل والتنزيل
            - **إضافة كافة دول العالم العربي (22 دولة)**: دعم شامل لجميع العواصم والمدن العربية بحسابات فلكية دقيقة مع تصنيفات إقليمية سريعة وميزة البحث اللحظي.
            - **إرجاع زر التحميل داخل المشغل**: إعادة زر «تحميل السورة محلياً» إلى شريط المشغل بجانب زر التكرار بتصميم متناسق وجذاب، مع الحفاظ على نظافة قائمة السور في الشاشة الرئيسية.
            - **سلاسة فائقة في تنقل الثواني**: تجربة سحب وتمرير للثواني (Seeking) فائقة الانسيابية وبدون أي تقطيع أو تذبذب أثناء الاستماع للتلاوة.
            - **تحديث معدل المتابعة الزمنية**: رفع دقة وتزامن عداد الثواني لمعدل استجابة 10Hz مع مشغل الصوت ExoPlayer.
          files: build-output/MinshawiQuran1967.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}