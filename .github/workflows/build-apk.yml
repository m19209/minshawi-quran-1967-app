name: Build Minshawi Quran APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon || (echo "Retrying Gradle build after transient network issue..." && sleep 5 && ./gradlew assembleDebug --stacktrace --no-daemon)

      - name: Rename APK for Distribution
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/MinshawiQuran1967.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MinshawiQuran1967-APK
          path: build-output/MinshawiQuran1967.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.3.2
          name: "مصحف المنشاوي 1967 والأذان الذكي v1.3.2"
          body: |
            ## التحديث الجذري v1.3.2 - الحل الشامل لتشغيل كافة التلاوات المحملة مسبقاً على الهاتف بدون إنترنت
            - **1. التعرف الشامل والتلقائي على التلاوات المحملة سابقاً**:
              - تم تطوير خوارزمية بحث ذكية تفحص كافة مسارات الهاتف (المسار الصوتي للتطبيق، ومجلد التنزيلات العام، ومجلد الموسيقى، والذاكرة الخارجية، ومستودع وسائط النظام MediaStore).
              - تدعم البحث بكافة صيغ التسمية التاريخية (مثل `001 - الفاتحة.mp3` أو `001 - الفاتحة - المنشاوي 1967.mp3` أو التسمية بالأرقام والأسماء المجردة) مع تطبيع كامل للهمزات والأحرف العربية.
            - **2. استيراد ونقل آمن إلى التخزين المستقل**:
              - عند العثور على أي تلاوة محملة سابقاً على الجهاز، يتم التعرف عليها فوراً ونقلها لمساحة التطبيق الخاصة لضمان تشغيلها بدون أي قيود أو أذونات على كافة إصدارات الأندرويد (من Android 5 وحتى Android 15).
            - **3. تشغيل أوفلاين 100% بدون إنترنت قطعي**:
              - عزل التلاوات المحفوظة عن شبكة الإنترنت لمنع حدوث أي بفرينج أو تحويل إلى السيرفرات السحابية عند انقطاع الاتصال.
              - دعم كامل لكافة السور القصيرة والطويلة بخفض حد التحقق إلى 30KB.
            - **4. الحفاظ الصارم على كافة المزايا السابقة**:
              - المسافة الهندسية الصارمة (14dp) بين الزرين.
              - عداد قياس سرعة التنزيل اللحظي (MB/s).
              - شارة الانتهاء وقائمة إدارة السورة المحفوظة.
              - استئناف التنزيل واستئناف موضع التلاوة.
              - البدء الفوري للتلاوة في 500ms.
          files: |
            build-output/MinshawiQuran1967.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}