name: Build Minshawi Quran APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK for Distribution
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/MinshawiQuran1967.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MinshawiQuran1967-APK
          path: build-output/MinshawiQuran1967.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.2.4
          name: "مصحف المنشاوي 1967 والأذان الذكي v1.2.4"
          body: |
            ## التحديث v1.2.4 - زيادة المسافة الفاصلة بين زري التحميل والتشغيل
            - **تحسين المسافة الفاصلة (Button Spacing)**: زيادة المسافة الفاصلة بين زر التحميل وزر التشغيل في كل صف سورة إلى 14dp لمنع التلاصق وضمان سهولة ودقة النقر بدون أي لمس خاطئ.
            - **تنسيق بصري متناسق ومريح للعين**: تباعد انسيابي يعطي كل زر مساحته الكاملة مع إبقاء أسماء السور واضحة تماماً.
            - **شامل كافة المميزات**: دعم 22 دولة عربية، تنزيل مباشر لمجلد الهاتف، سلاسة تنقل الثواني، والتقويم الهجري.
          files: build-output/MinshawiQuran1967.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}