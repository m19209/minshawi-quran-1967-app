name: Build Minshawi Quran APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK for Distribution
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/MinshawiQuran1967.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MinshawiQuran1967-APK
          path: build-output/MinshawiQuran1967.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.1.0
          name: "مصحف المنشاوي 1967 والأذان الذكي v1.1.0"
          body: |
            ## التحديث الشامل v1.1.0 - مصحف المنشاوي 1967 والأذان الذكي
            - **تشغيل التلاوة في الخلفية وشاشة القفل**: دعم استمرار الصوت وعناصر التحكم الكاملة عند إغلاق الشاشة أو قفل الهاتف مع WakeLock رسمي.
            - **ميزة تنزيل السور على الجهاز**: زر تنزيل مباشر في مشغل التلاوة وقائمة السور لحفظ الملفات الصوتية بمجلد التنزيلات.
            - **العداد التنازلي التفاعلي للصلاة**: عداد حي بالثواني يحسب الوقت المتبقي لكل أذان بدقة دون أي تجميد.
            - **عداد التلاوة المتناسق**: عرض وقت التلاوة المنقضي والوقت المتبقي بتناقص لحظي وبدون إشارة السالب، مع إزالة أزرار التسارع والمفضلة الزائدة.
            - **سلاسة فائقة في التمرير (60/120 FPS)**: عزل عمليات التحديث داخل المشغل وضمان خفة التطبيق وسرعته.
          files: build-output/MinshawiQuran1967.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}