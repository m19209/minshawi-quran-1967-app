name: Build Minshawi Quran APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK for Distribution
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/MinshawiQuran1967.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MinshawiQuran1967-APK
          path: build-output/MinshawiQuran1967.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.2.0
          name: "مصحف المنشاوي 1967 والأذان الذكي v1.2.0"
          body: |
            ## التحديث الشامل v1.2.0 - مصحف المنشاوي 1967 والأذان الذكي
            - **التقويم الهجري اليومي**: استبدال الصلاة الحالية بالتقويم الهجري تلقائياً بتنسيق إسلامي ذهبي فخم.
            - **تكبير وتوضيح الصلاة القادمة**: إبراز اسم الصلاة القادمة والعداد التنازلي بخط عربي عريض وكبير واضح للمستخدم.
            - **إعدادات الأذان الذكي وتخصيص الصوت**: إمكانية اختيار الأذان (المنشاوي، الحرم المكي، المسجد النبوي) مع جعل أذان الشيخ المنشاوي رحمه الله هو الافتراضي.
            - **علامة الترددات الصوتية التفاعلية (Equalizer)**: ترددات صوتية حية نابضة تتفاعل لحظياً مع التلاوة.
            - **تصميم أيقونة الترس الميكانيكي**: اعتماد أيقونة الترس الدائري الكلاسيكي الفخم لفتح الإعدادات.
            - **واجهة مشغل نقية وهادئة**: حذف النجمة وعبارة «تسجيل إذاعي استثنائي» وحذف أي أزرار زائدة.
          files: build-output/MinshawiQuran1967.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}