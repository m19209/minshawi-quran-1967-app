name: Build Minshawi Quran APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon || (echo "Retrying Gradle build after transient network issue..." && sleep 5 && ./gradlew assembleDebug --stacktrace --no-daemon)

      - name: Rename APK for Distribution
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/MinshawiQuran1967.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MinshawiQuran1967-APK
          path: build-output/MinshawiQuran1967.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.2.8
          name: "مصحف المنشاوي 1967 والأذان الذكي v1.2.8"
          body: |
            ## التحديث v1.2.8 - دورة الحياة الشاملة لزر التنزيل (Full Lifecycle Download Engine)
            - **قبل البدء (Before Starting)**: فحص حالة الإنترنت وإشعار المستخدم، زر أنيق بحجم 38dp مع الحفاظ الصارم على المسافة 14dp.
            - **بين / أثناء التنزيل (Between/During)**:
              - **إيقاف مؤقت حقيقي (Pause)**: نقرة على الزر توقف التنزيل مؤقتاً مع الحفاظ التام على البايتات والملف المؤقت `.part` وظهور أيقونة الاستئناف ▶.
              - **استئناف فوري بدون إعادة (HTTP Range Resume)**: نقرة مجدداً تستأنف التنزيل عبر ترويسة `Range: bytes=X-` من نفس النسبة دون البدء من 0%.
              - **إلغاء وحذف كامل (Cancel)**: ضغطة مطولة تلغي التنزيل وتحذف الملف المؤقت فوراً.
              - **حماية انقطاع الشبكة**: توقف مؤقت تلقائي عند ضعف الشبكة دون فقدان ما تم تنزيله.
            - **بعد الانتهاء (After Completion)**:
              - **أيقونة الصح المكتملة (`ic_check_circle`)**: تدل على أن السورة محفوظة بدون إنترنت.
              - **نافذة خيارات الملف المكتمل (Completed Surah Dialog)**: تفتح عند النقر، وتتضمن:
                1. 🎵 تشغيل السورة أوفلاين مباشرة.
                2. ℹ️ استعراض تفاصيل وحجم الملف الفعلي وجودة تسجيل 1967 النقية.
                3. 🗑️ حذف السورة من الهاتف لتوفير مساحة الذاكرة مع إعادة الزر لحالة البداية فوراً.
          files: build-output/MinshawiQuran1967.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}