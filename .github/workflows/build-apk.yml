name: Build Minshawi Quran APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon || (echo "Retrying Gradle build after transient network issue..." && sleep 5 && ./gradlew assembleDebug --stacktrace --no-daemon)

      - name: Rename APK for Distribution
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/MinshawiQuran1967.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MinshawiQuran1967-APK
          path: build-output/MinshawiQuran1967.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.3.0
          name: "مصحف المنشاوي 1967 والأذان الذكي v1.3.0"
          body: |
            ## التحديث الشامل v1.3.0 - التلاوة الفورية والاستقرار المطلق لمشغل الصوت والتنزيل
            - **1. تشغيل التلاوة الفوري والمضمون 100%**:
              - معالجة وإصلاح تهيئة مشغل الصوت ExoPlayer ليعمل الصوت فوراً وبسلاسة تامة عند النقر على أي سورة أو زر التشغيل بدون أي عوائق أو توقف.
              - تفعيل تصريح الوسائط الشفافة (`usesCleartextTraffic`) لضمان انسيابية تدفق الصوت ومحتوى البث الصوتي.
            - **2. الحفاظ الصارم على التشغيل أوفلاين 100% بدون إنترنت**:
              - السور المحملة على الهاتف تعمل فورياً وبشكل مباشر من الذاكرة المحلية حتى في وضع الطيران (Airplane Mode) وبدون الحاجة لأي اتصال بالإنترنت.
            - **3. استئناف التلاوة من موضع التوقف الدقيق**:
              - حفظ الموضع الدقيق للتلاوة بالمللي ثانية، وعند الضغط على تشغيل بعد التوقف المؤقت يتم استكمال التلاوة من نفس الثانية بالضبط دون الرجوع إلى الصفر (0:00).
            - **4. استئناف التنزيل الحقيقي بدون فقدان البيانات (HTTP Range Resume)**:
              - الحفاظ التام على ترويسة `Range: bytes=X-` عبر الروابط المحولة، واستخراج الحجم الكلي بدقة من `Content-Range` لاستئناف التحميل من نفس النسبة دون البدء من 0%.
            - **5. الحفاظ التام على المسافة الفاصلة (14dp) وعداد السرعة اللحظي وشارة الانتهاء**:
              - التصميم الهندسي للمسافات وقياس السرعة اللحظية ونافذة إدارة السور المحفوظة تم تثبيتها وتأمينها بنسبة 100%.
          files: |
            build-output/MinshawiQuran1967.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}