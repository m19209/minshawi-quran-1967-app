name: Build Minshawi Quran APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon || (echo "Retrying Gradle build after transient network issue..." && sleep 5 && ./gradlew assembleDebug --stacktrace --no-daemon)

      - name: Rename APK for Distribution
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/MinshawiQuran1967.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MinshawiQuran1967-APK
          path: build-output/MinshawiQuran1967.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.3.1
          name: "مصحف المنشاوي 1967 والأذان الذكي v1.3.1"
          body: |
            ## التحديث الجذري v1.3.1 - القضاء النهائي على مشكلة الـ Buffering وبدء التلاوة الفوري
            - **1. حل مشكلة البفرينج وبدء التشغيل الفوري في 500ms**:
              - تم تقليل الحد الأدنى لبدء التلاوة عبر `DefaultLoadControl` من 2500ms إلى 500ms فقط، ليبدأ الصوت بالخروج فور استلام أول جزء من التلاوة دون أي انتظار.
            - **2. نظام الحماية الذاتي من بطء السيرفرات (Buffering Watchdog Timer)**:
              - في حال حدوث أي بطء أو تعليق في شبكة سيرفر الأرشيف لأكثر من 3.5 ثانية، يقوم التطبيق تلقائياً وبشكل غير مرئي بالتحويل الفوري إلى سيرفر كلاود فلير البديل السريع (Cloudflare CDN Mirror) لتبدأ التلاوة فوراً من نفس الثانية.
              - إذا ضغط المستخدم على زر التشغيل أثناء التخزين المؤقت (Buffering)، يتم نقله فوراً وبلمسة واحدة إلى السيرفر البديل فائق السرعة.
            - **3. الحفاظ التام والصارم على كافة الميزات السابقة**:
              - التشغيل أوفلاين 100% بدون إنترنت للسور المحملة.
              - استئناف التلاوة من نفس الموضع الدقيق بالمللي ثانية وعدم التصفير.
              - استئناف التنزيل الحقيقي (HTTP Range) دون مسح البيانات المحملة.
              - المسافة الهندسية الصارمة (14dp) بين زري التنزيل والتشغيل.
              - عداد السرعة اللحظي وشارة الانتهاء المكتملة ونافذة إدارة السور.
          files: |
            build-output/MinshawiQuran1967.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}