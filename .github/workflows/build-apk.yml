name: Build Minshawi Quran APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon || (echo "Retrying Gradle build after transient network issue..." && sleep 5 && ./gradlew assembleDebug --stacktrace --no-daemon)

      - name: Rename APK for Distribution
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/MinshawiQuran1967.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MinshawiQuran1967-APK
          path: build-output/MinshawiQuran1967.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.3.3
          name: "مصحف المنشاوي 1967 والأذان الذكي v1.3.3"
          body: |
            ## التحديث v1.3.3 — سلاسة فائقة في التمرير (60/120 FPS Buttery Scrolling)
            - **1. القضاء التام على تقطيع التمرير لأسفل (Zero UI Disk I/O)**:
              - تم تحويل فحص حالة التنزيل لقراءة فورية في الذاكرة دون أي مساس بالقرص أو استعلامات SQLite في وسائط النظام MediaStore على مسار الواجهة.
            - **2. استقرار Jetpack Compose وتفعيل التخطي الذكي (@Immutable)**:
              - إعلان استقرار فئات البيانات لتمكين Compose من تخطي إعادة معالجة العناصر غير المتغيرة أثناء التمرير.
            - **3. محرك فحص سريع على مرحلتين (Two-Pass Ultra-Fast Scanner)**:
              - تقليص زمن فحص السور المخزنة عند الإقلاع من 15 ثانية إلى أقل من 20 مللي ثانية دون أي منافسة على موارد المعالج.
            - **4. الحفاظ الكامل على كافة المزايا والاشتراطات**:
              - المسافة الهندسية الصارمة (14dp) بين الزرين.
              - عداد سرعة التنزيل اللحظي (MB/s).
              - شارة الانتهاء وقائمة إدارة السورة المحفوظة.
              - استئناف التنزيل واستئناف موضع التلاوة.
              - تشغيل التلاوات المحملة مسبقاً أوفلاين 100% بدون إنترنت.
          files: |
            build-output/MinshawiQuran1967.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}