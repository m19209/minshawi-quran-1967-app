name: Build Minshawi Quran APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon || (echo "Retrying Gradle build after transient network issue..." && sleep 5 && ./gradlew assembleDebug --stacktrace --no-daemon)

      - name: Rename APK for Distribution
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/MinshawiQuran1967.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MinshawiQuran1967-APK
          path: build-output/MinshawiQuran1967.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.2.6
          name: "مصحف المنشاوي 1967 والأذان الذكي v1.2.6"
          body: |
            ## التحديث v1.2.6 - أيقونة اكتمال التحميل المخصصة وقياس السرعة اللحظية
            - **أيقونة اكتمال التحميل المخصصة (Dedicated Completed Icon)**: تحول زر التحميل تلقائياً وبشكل جذاب إلى أيقونة دائرة الصح الذهبية (`ic_check_circle`) بمجرد اكتمال التحميل لتدل بوضوح قاطع على أن السورة تم الانتهاء من تحميلها.
            - **إشعار نصي لحالة الحفظ**: إضافة عبارة "محفوظة بدون إنترنت ✓" أسفل اسم كل سورة مكتملة التحميل، وعند الضغط على أيقونة الإكمال تظهر رسالة تأكيد أن السورة محفوظة وتعمل بدون إنترنت.
            - **عداد سرعة التحميل اللحظي (Live Download Rate)**: عرض دقيق ومستمر لسرعة التحميل اللحظية (مثل `2.4 MB/s` أو `850 KB/s`).
            - **المؤشر الدائري لنسبة الإنجاز**: عرض النسبة المئوية في المنتصف مع شريط متوهج أسفل بطاقة السورة.
            - **الحفاظ التام على المسافة الفاصلة (14dp Spacing)**: تباعد ثابت ومريح يمنع أي تداخل بين الأزرار.
          files: build-output/MinshawiQuran1967.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}